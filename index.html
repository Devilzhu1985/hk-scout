<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="取景记录">
<link rel="manifest" href="manifest.webmanifest">

<title>香港取景记录</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f2328;--sub:#646b78;--line:#e3e1db;--red:#c4382b;--redS:#fbeeea;--blue:#2a6f97;--blueS:#e8f1f7;--ok:#2f7d4f;--okS:#e7f4ec;--amber:#b7791f;--amberS:#fdf3e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:#1f2328;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header .clock{font-size:13px;color:#c9ccd1;text-align:right;line-height:1.3}
main{max-width:720px;margin:0 auto;padding:12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .i{font-size:19px;line-height:1}
.tabbar button.on{color:var(--red);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
h2.sec{font-size:15px;margin:18px 2px 8px;color:var(--sub);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
.tiny{color:var(--sub);font-size:12px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;font-family:inherit}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn.danger{color:var(--red);border-color:#efc8c2}
.btn.block{width:100%;display:block}
.btn:active{transform:scale(.98)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.seg{display:flex;background:#ecebe6;border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:13px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f0eee9}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--red);flex:none}
.chk .t{font-weight:500}
.chk.done .t{color:#9aa0a8;text-decoration:line-through}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--redS);color:var(--red);vertical-align:1px}
.badge.b{background:var(--blueS);color:var(--blue)}
.badge.g{background:var(--okS);color:var(--ok)}
.badge.a{background:var(--amberS);color:var(--amber)}
.tip{background:var(--blueS);border-left:4px solid var(--blue);padding:9px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.warn{background:var(--redS);border-left:4px solid var(--red);padding:9px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{font-weight:600}
.big{font-size:22px;font-weight:700}
.sunbar{position:relative;height:26px;border-radius:7px;overflow:hidden;background:#eee;margin:8px 0 4px}
.sunbar div{position:absolute;top:0;bottom:0}
.sunbar .now{width:2px;background:#000}
.pt{display:flex;gap:10px;align-items:center}
.pt .code{font-weight:700;font-size:15px;min-width:64px}
.prog{height:5px;background:#eee;border-radius:3px;overflow:hidden;margin-top:5px}
.prog div{height:100%;background:var(--ok)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.out{background:#f3f2ee;border-radius:9px;padding:9px 11px;font-size:14px;margin-top:8px}
.out .v{font-weight:700;font-size:17px}
.namebtns{display:grid;grid-template-columns:1fr;gap:6px}
.namebtns button{text-align:left;font-family:Consolas,Menlo,monospace;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink);display:flex;justify-content:space-between;gap:8px;word-break:break-all}
.namebtns button span.l{color:var(--sub);font-family:inherit;flex:none}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid #eee;padding:6px 4px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:50;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.modal img{max-width:100%;max-height:75vh;border-radius:8px}
.modal .row{margin-top:12px}
.colorrow{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
.swatch{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);flex:none}
.step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0eee9;align-items:flex-start}
.step:last-child{border-bottom:0}
.step .n{width:26px;height:26px;border-radius:50%;background:#e7e5df;color:var(--sub);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.step.on .n{background:var(--ok);color:#fff}
.step.opt .t::after{content:" 可选";font-size:11px;color:var(--amber)}
.step.skip{opacity:.4}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
canvas#gcCanvas{width:100%;border-radius:8px;touch-action:manipulation;display:block}
.hide{display:none!important}
.backbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">香港取景记录</h1>

  <button data-tab="log"><span class="i">✎</span>记录</button>
  <button data-tab="tools"><span class="i">⚙</span>工具</button>
  <button data-tab="wrap"><span class="i">⇪</span>收工</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" class="hide">
<input type="file" id="gcInput" accept="image/*" class="hide">
<input type="file" id="importInput" accept="application/json,.json" class="hide">

/* ========== 太阳时间（日出日落方程，精度约 1–2 分钟）========== */
function sunTimes(dateStr, lat = HK.lat, lng = HK.lng){
  const [y, m, d] = dateStr.split('-').map(Number);
  const rad = Math.PI / 180, jdToMs = j => (j - 2440587.5) * 86400000;
  const JD = Date.UTC(y, m - 1, d, 4, 0, 0) / 86400000 + 2440587.5;
  const n = Math.ceil(JD - 2451545.0 + 0.0008);
  const Js = n - lng / 360;
  const M = ((357.5291 + 0.98560028 * Js) % 360 + 360) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const sinD = Math.sin(L * rad) * Math.sin(23.4397 * rad), cosD = Math.cos(Math.asin(sinD));
  const at = h => { const c = (Math.sin(h * rad) - Math.sin(lat * rad) * sinD) / (Math.cos(lat * rad) * cosD); if(c < -1 || c > 1) return null; const w = Math.acos(c) / rad; return {am: jdToMs(Jt - w / 360), pm: jdToMs(Jt + w / 360)}; };
  return {noon: jdToMs(Jt), g6: at(6), sun: at(-0.833), b4: at(-4), b8: at(-8)};
}

const DB = {
  db: null,
  open(){ return this.db ? Promise.resolve() : new Promise((res, rej) => { const r = indexedDB.open('hkscout', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath:'id'}); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(mode, fn){ return this.open().then(() => new Promise((res, rej) => { const t = this.db.transaction('photos', mode); const st = t.objectStore('photos'); const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); })); },
  put(o){ return this.tx('readwrite', s => s.put(o)); },
  get(id){ return this.tx('readonly', s => s.get(id)); },
  del(id){ return this.tx('readwrite', s => s.delete(id)); },
  all(){ return this.tx('readonly', s => s.getAll()); }
};
const urlCache = {};
async function photoUrl(id){ if(urlCache[id]) return urlCache[id]; const o = await DB.get(id); if(!o) return ''; return (urlCache[id] = URL.createObjectURL(o.blob)); }
function loadImage(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file); const img = new Image(); img.onload = () => res({img, u}); img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('图片无法读取')); }; img.src = u; }); }
async function compress(file, max = 1600, q = 0.82){
  const {img, u} = await loadImage(file);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}

function newPoint(area, place, placeId){

  const p = {id: uid(), area, seqNo: seq, code: area + '-' + pad(seq), place: place || '', placeId: placeId || '', tag: '', t: Date.now(),
    lat: null, lng: null, acc: null, weather: [], ground: '', lights: [], shutter: '', iso: S.settings.iso || '', lux: {A:'', B:'', C:'', D:''},
    colors: [], steps: {}, notes: '', photos: [], seq: {}};

  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  return p;
}

function fileBase(p){ return [p.area, (p.tag || '').replace(/[^A-Za-z0-9-]/g, '') || ('P' + pad(p.seqNo)), hkMD(p.t), hkHMc(p.t)].join('_'); }
function nextName(p, type){ return fileBase(p) + '_' + type + '_' + pad((p.seq[type] || 0) + 1); }
function luxCalc(p){
  const A = num(p.lux.A), B = num(p.lux.B), C = num(p.lux.C), D = num(p.lux.D);
  const r = {A, B, C, D};
  if(C > 0){ r.ratio = [A, B].map(v => v > 0 ? fmt(v / C, 1) : '—').concat('1').join(' : '); }
  if(A > 0 && C > 0) r.evAC = log2(A / C);
  if(B > 0 && C > 0) r.evBC = log2(B / C);
  if(A > 0 && B > 0) r.evAB = log2(A / B);
  if(D > 0 && B > 0) r.evDB = log2(D / B);
  return r;
}

function sunCard(){
  const today = hkDate(Date.now()), st = sunTimes(today), now = Date.now();
  if(!st.sun) return '';
  const ev = [
    ['日出', st.sun.am], ['黄金时段开始', st.g6 && st.g6.pm], ['日落', st.sun.pm], ['蓝调开始', st.b4 && st.b4.pm], ['蓝调结束（入夜）', st.b8 && st.b8.pm]
  ].filter(x => x[1]);
  const next = ev.find(x => x[1] > now);
  let nextTxt = '今天的光线窗口已过，晚上以人工光为主';
  if(next){ const m = Math.round((next[1] - now) / 60000); nextTxt = `距 <b>${next[0]}</b> 还有 <b>${m >= 60 ? Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分' : m + ' 分钟'}</b>`; }
  // 时间条 06:00–21:00
  const d0 = Date.parse(today + 'T06:00:00+08:00'), d1 = Date.parse(today + 'T21:00:00+08:00');
  const x = t => Math.max(0, Math.min(100, (t - d0) / (d1 - d0) * 100));
  const seg = (a, b, c) => `<div style="left:${x(a)}%;width:${x(b) - x(a)}%;background:${c}"></div>`;
  let bar = seg(d0, d1, '#cfd8e3');
  bar += seg(st.sun.am, st.sun.pm, '#fbe7a1');
  if(st.g6) bar += seg(st.g6.pm, st.sun.pm, '#f4b45d');
  if(st.b4 && st.b8) bar += seg(st.b4.pm, st.b8.pm, '#5b7fbf');
  if(st.b8) bar += seg(st.b8.pm, d1, '#2b3550');
  if(now > d0 && now < d1) bar += `<div class="now" style="left:${x(now)}%"></div>`;
  return `<div class="card"><h3>今日光线窗口 <span class="tiny">（香港 · ${today}）</span></h3>
    <div class="sub">${nextTxt}</div>
    <div class="sunbar">${bar}</div>
    <div class="row tiny" style="justify-content:space-between"><span>06:00</span><span>12:00</span><span>18:00</span><span>21:00</span></div>
    <div class="kv" style="margin-top:8px">
      <span>日出</span><b>${hkHM(st.sun.am)}</b>
      ${st.g6 ? `<span>黄金时段</span><b>${hkHM(st.g6.pm)} – ${hkHM(st.sun.pm)}</b>` : ''}
      <span>日落</span><b>${hkHM(st.sun.pm)}</b>
      ${st.b4 && st.b8 ? `<span>蓝调</span><b>${hkHM(st.b4.pm)} – ${hkHM(st.b8.pm)}</b>` : ''}
    </div>
    <div class="tiny" style="margin-top:6px">按太阳高度角计算（黄金 +6°~日落，蓝调 −4°~−8°），高楼遮挡会让街面更早变暗，以现场为准。</div></div>`;
}

    `EV100 <span class="v">${fmt(ev, 1)}</span> · 估算照度约 <span class="v">${fmt(evToLux(ev), 0)}</span> lux<div class="tiny">按相机测光反推，只作粗略参考</div>`;
  const lc = luxCalc(p), lo = $('#luxOut');

/* 灰卡取色 */
let gcImg = null, gcRes = null, gcPt = null;
function drawGc(){
  const c = $('#gcCanvas'); if(!c || !gcImg) return;
  const w = Math.min(1400, gcImg.naturalWidth), s = w / gcImg.naturalWidth;
  c.width = w; c.height = Math.round(gcImg.naturalHeight * s);
  const g = c.getContext('2d', {willReadFrequently:true}); g.drawImage(gcImg, 0, 0, c.width, c.height);
  if(gcPt){ g.strokeStyle = '#ff2d55'; g.lineWidth = Math.max(2, c.width / 300); const r = Math.max(8, c.width / 60); g.strokeRect(gcPt.x - r, gcPt.y - r, r * 2, r * 2); }
}
function srgbToLin(c){ c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function linToSrgb(c){ c = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.round(Math.max(0, Math.min(1, c)) * 255); }
function sampleGc(x, y){
  const c = $('#gcCanvas'), g = c.getContext('2d', {willReadFrequently:true});
  drawGc();
  const r = Math.max(4, Math.round(c.width / 80));
  const x0 = Math.max(0, Math.round(x - r)), y0 = Math.max(0, Math.round(y - r));
  const w = Math.min(c.width - x0, r * 2), h = Math.min(c.height - y0, r * 2);
  const d = g.getImageData(x0, y0, w, h).data; let R = 0, G = 0, B = 0, n = 0;
  for(let i = 0; i < d.length; i += 4){ R += d[i]; G += d[i + 1]; B += d[i + 2]; n++; }
  R /= n; G /= n; B /= n;
  const lr = srgbToLin(R), lg = srgbToLin(G), lb = srgbToLin(B), mx = Math.max(lr, lg, lb) || 1;
  const nr = lr / mx, ng = lg / mx, nb = lb / mx;
  const hex = '#' + [nr, ng, nb].map(v => linToSrgb(v).toString(16).padStart(2, '0')).join('').toUpperCase();
  const tags = [];
  if(lr / lb > 1.1) tags.push('偏暖'); else if(lb / lr > 1.1) tags.push('偏冷'); else tags.push('接近中性');
  const rb = (lr + lb) / 2;
  if(lg > rb * 1.08) tags.push('偏青绿'); else if(lg < rb * 0.92) tags.push('偏品红');
  const lum = 0.2126 * lr + 0.7152 * lg + 0.0722 * lb;
  gcRes = {R: Math.round(R), G: Math.round(G), B: Math.round(B), hex, lin: [nr, ng, nb].map(v => v.toFixed(3)).join(', '), tags: tags.join('，'), warn: (Math.max(R, G, B) > 245 ? '灰卡接近过曝，结果可能不准' : lum < 0.01 ? '灰卡太暗，结果可能不准' : '')};
  gcPt = {x, y}; drawGc();
  $('#gcOut').innerHTML = gcResultHtml();
}
function gcResultHtml(){
  if(!gcRes) return '';
  return `<div class="out"><div class="row"><div class="swatch" style="background:${gcRes.hex}"></div>
    <div class="grow">灯光颜色 <span class="v">${gcRes.hex}</span><div class="tiny">${gcRes.tags}</div></div>
    <button class="btn sm" data-act="copyTxt" data-t="${gcRes.hex} ${gcRes.tags}">复制</button></div>
    <div class="tiny" style="margin-top:6px">取样 sRGB：${gcRes.R}, ${gcRes.G}, ${gcRes.B} · 线性归一化：${gcRes.lin}</div>
    ${gcRes.warn ? `<div class="tiny" style="color:var(--red)">${gcRes.warn}</div>` : ''}</div>`;
}

function exportMd(){
  let md = `# 香港取景记录\n\n导出时间：${hkDate(Date.now())} ${hkHM(Date.now())}（香港）　白平衡 ${S.settings.wb}K　光圈 f/${S.settings.fnum}\n\n`;
  const groups = {}; S.points.slice().reverse().forEach(p => { const d = hkDate(p.t); (groups[d] = groups[d] || []).push(p); });
  Object.keys(groups).sort().forEach(d => {
    md += `## ${d}\n\n`;
    groups[d].forEach(p => {
      const lc = luxCalc(p);
      md += `### ${p.code} ${p.place || AREA_NAME[p.area]}\n\n- 时间：${hkHM(p.t)}${p.lat != null ? `　位置：${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}` : ''}\n- 天气：${p.weather.join('/') || '—'}　地面：${p.ground || '—'}\n- 主光源：${p.lights.join('、') || '—'}\n- 相机：${p.shutter || '—'} / ISO ${p.iso || '—'}\n- 亮度：A ${p.lux.A || '—'} / B ${p.lux.B || '—'} / C ${p.lux.C || '—'} / D ${p.lux.D || '—'} lux${lc.ratio ? `　光比 ${lc.ratio}` : ''}${lc.evAC != null ? `　动态范围约 ${lc.evAC.toFixed(1)} 档` : ''}\n`;
      if(p.colors.length) md += `- 光源色：\n` + p.colors.map(c => `  - ${c.type || '—'}（${c.feel || '—'}）${c.file ? ' · ' + c.file : ''}${c.reading ? ' · ' + c.reading : ''}`).join('\n') + '\n';
      md += `- 文件前缀：\`${fileBase(p)}\`\n- 流程：${stepsDone(p)}/${STEPS.length}${STEPS.some((s, i) => !p.steps[i]) ? '（未完成：' + STEPS.filter((s, i) => !p.steps[i]).map(s => s.t).join('、') + '）' : ''}\n`;
      if(p.notes) md += `- 备注：${p.notes.replace(/\n/g, ' ')}\n`;
      md += '\n';
    });
  });
  const ps = allPlaces().filter(p => pstate(p.id).note);
  if(ps.length) md += `## 地点备注\n\n` + ps.map(p => `- ${p.n}：${pstate(p.id).note}`).join('\n') + '\n';
  shareOrDownload('HK取景_报告_' + stamp() + '.md', new Blob([md], {type:'text/markdown'}));
}
async function exportJson(withPhotos){
  const data = JSON.parse(JSON.stringify(S)); data.exportedAt = Date.now();
  if(withPhotos){ toast('正在打包照片…'); const all = await DB.all(); data.photoData = {}; for(const o of all) data.photoData[o.id] = {pointId: o.pointId, t: o.t, d: await blobToDataUrl(o.blob)}; }
  shareOrDownload('HK取景_备份_' + (withPhotos ? '含照片_' : '') + stamp() + '.json', new Blob([JSON.stringify(data)], {type:'application/json'}));
}
async function exportPhotos(){
  const list = []; S.points.forEach(p => p.photos.forEach((id, i) => list.push([p, id, i])));
  if(!list.length) return toast('还没有记录照片');
  if(!confirm(`将逐张导出 ${list.length} 张照片，继续？`)) return;
  for(const [p, id, i] of list){ const o = await DB.get(id); if(o) await shareOrDownload(`${fileBase(p)}_Ref_${pad(i + 1)}.jpg`, o.blob); }
}
async function importJson(file){
  try{
    const data = JSON.parse(await file.text());
    if(!data || !data.v || !Array.isArray(data.points)) throw new Error('格式不对');
    if(!confirm(`备份里有 ${data.points.length} 个点位。恢复会覆盖当前数据，继续？`)) return;
    if(data.photoData){ for(const [id, o] of Object.entries(data.photoData)) await DB.put({id, pointId: o.pointId, t: o.t, blob: await dataUrlToBlob(o.d)}); delete data.photoData; }
    delete data.exportedAt; S = Object.assign(fresh(), data); saveNow(); toast('已恢复'); go('log');
  }catch(e){ alert('恢复失败：' + e.message); }
}

/* ========== 事件 ========== */
let photoTarget = null;
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if(el.tagName === 'INPUT' && el.type === 'checkbox') return; // 由 change 处理
  const p = editing ? getPoint(editing) : null;
  switch(a){
    case 'goTools': toolSeg = 'set'; go('tools'); break;
    case 'day': dayIdx = +el.dataset.i; render(); break;
    case 'quickNew': { const np = newPoint('OTH'); go('log', {edit: np.id}); toast('已新建 ' + np.code + '，记得选区域'); break; }
    case 'pnew': { const pl = placeById(id); const np = newPoint(pl.area, pl.n, pl.id); go('log', {edit: np.id}); toast('已新建 ' + np.code); break; }
    case 'pnote': { const s = pstate(id); const v = prompt('地点备注', s.note || ''); if(v !== null){ s.note = v.trim(); save(); render(); } break; }
    case 'pdel': if(confirm('删除这个自定义地点？')){ S.customPlaces = S.customPlaces.filter(x => x.id !== id); save(); render(); } break;
    case 'pf': placeFilter = el.dataset.v; render(); break;
    case 'cpAdd': { const n = $('#cpName').value.trim(); if(!n) return toast('请填写名称'); S.customPlaces.push({id: 'c_' + uid(), cat: 'X', area: $('#cpArea').value, n, d: $('#cpDesc').value.trim(), q: n, custom: true}); save(); render(); toast('已添加'); break; }
    case 'open': go('log', {edit: id}); break;
    case 'back': saveNow(); editing = null; render(); window.scrollTo(0, 0); break;
    case 'chip': {
      if(el.dataset.f === undefined) break;
      const f = el.dataset.f, v = el.dataset.v;
      if(el.dataset.m === '1'){ const arr = p[f]; const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); }
      else p[f] = p[f] === v ? '' : v;
      save(); rerenderKeep(); break;
    }
    case 'quick': S.quick = !S.quick; save(); rerenderKeep(); break;
    case 'step': { const i = +el.dataset.i; p.steps[i] = !p.steps[i]; save(); rerenderKeep(); break; }
    case 'name': { const k = el.dataset.k; const n = nextName(p, k); await copy(n); p.seq[k] = (p.seq[k] || 0) + 1; save(); rerenderKeep(); break; }
    case 'nreset': if(confirm('把所有类型的序号重置为 01？')){ p.seq = {}; save(); rerenderKeep(); } break;
    case 'cadd': p.colors.push({type: '', feel: '', file: nextName(p, 'Gray'), reading: ''}); save(); rerenderKeep(); break;
    case 'cdel': p.colors.splice(+el.dataset.i, 1); save(); rerenderKeep(); break;
    case 'tnow': if(confirm('把点位时间改为现在？文件名里的时间也会跟着变。')){ p.t = Date.now(); save(); rerenderKeep(); } break;
    case 'gps': {
      if(!navigator.geolocation) return toast('此浏览器不支持定位');
      $('#gpsOut').textContent = '定位中…';
      navigator.geolocation.getCurrentPosition(pos => { p.lat = pos.coords.latitude; p.lng = pos.coords.longitude; p.acc = pos.coords.accuracy; save(); rerenderKeep(); toast('已定位'); },
        err => { $('#gpsOut').textContent = '定位失败：' + (err.code === 1 ? '没有定位权限' : '信号不好，稍后重试'); }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 30000});
      break;
    }
    case 'photo': photoTarget = p.id; $('#photoInput').value = ''; $('#photoInput').click(); break;
    case 'pview': {
      const u = await photoUrl(id), pp = getPoint(editing), idx = pp.photos.indexOf(id);
      const m = document.createElement('div'); m.className = 'modal';
      m.innerHTML = `<img src="${u}" alt=""><div class="row"><button class="btn" data-m="dl">保存</button><button class="btn danger" data-m="del">删除</button><button class="btn pri" data-m="x">关闭</button></div>`;
      m.addEventListener('click', async ev => {
        const b = ev.target.closest('[data-m]'); if(!b){ if(ev.target === m) m.remove(); return; }
        ev.stopPropagation();
        if(b.dataset.m === 'dl'){ const o = await DB.get(id); shareOrDownload(`${fileBase(pp)}_Ref_${pad(idx + 1)}.jpg`, o.blob); }
        if(b.dataset.m === 'del' && confirm('删除这张照片？')){ pp.photos = pp.photos.filter(x => x !== id); await DB.del(id); save(); m.remove(); rerenderKeep(); }
        if(b.dataset.m === 'x') m.remove();
      });
      document.body.appendChild(m); break;
    }
    case 'pdelete': if(confirm(`删除点位 ${p.code}？此操作无法撤销。`)){ for(const pid of p.photos) await DB.del(pid).catch(() => {}); S.points = S.points.filter(x => x.id !== p.id); save(); editing = null; render(); } break;
    case 'tseg': toolSeg = el.dataset.v; render(); break;
    case 'gcPick': $('#gcInput').value = ''; $('#gcInput').click(); break;
    case 'copyTxt': copy(el.dataset.t); break;
    case 'exCsv': exportCsv(); break;
    case 'exColor': exportColor(); break;
    case 'exMd': exportMd(); break;
    case 'exJson': exportJson(false); break;
    case 'exJsonP': exportJson(true); break;
    case 'exPhotos': exportPhotos(); break;
    case 'import': $('#importInput').value = ''; $('#importInput').click(); break;
    case 'wipe':
      if(confirm('清空全部数据（点位、照片、勾选）？建议先导出完整备份。') && confirm('再次确认：真的清空？')){
        const all = await DB.all().catch(() => []); for(const o of all) await DB.del(o.id); S = fresh(); saveNow(); go('today'); toast('已清空');
      } break;
  }
});
function rerenderKeep(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.act === 'pdone'){ pstate(el.dataset.id).done = el.checked; save(); rerenderKeep(); return; }
  if(el.dataset.act === 'ck'){ const st = (S.checks[el.dataset.k] = S.checks[el.dataset.k] || {}); st[el.dataset.i] = el.checked; save(); el.closest('.chk').classList.toggle('done', el.checked); return; }
  if(el.dataset.f && el.tagName === 'SELECT') setField(el);
  if(el.dataset.f === 'area'){ const p = getPoint(editing); reCode(p); rerenderKeep(); }
  if(el.dataset.s){ S.settings[el.dataset.s] = el.value.trim(); save(); if(el.dataset.s === 'tripStart') dayIdx = null; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.f && el.tagName !== 'SELECT'){ setField(el); if(el.dataset.f === 'tag') updateNames(); }
  if(el.dataset.s){ S.settings[el.dataset.s] = el.value.trim(); save(); }
  if(['cT','cI','cN'].includes(el.id)) calcExp();
  if(el.id === 'lx'){ const v = num(el.value); $('#le').value = v > 0 ? luxToEv(v).toFixed(2) : ''; }
  if(el.id === 'le'){ const v = num(el.value); $('#lx').value = v != null ? fmt(evToLux(v), 1) : ''; }
  if(el.id === 'r1' || el.id === 'r2'){ const a = num($('#r1').value), b = num($('#r2').value); $('#rOut').innerHTML = a > 0 && b > 0 ? `比值 <span class="v">${fmt(a / b, 1)} : 1</span> · 相差 <span class="v">${fmt(log2(a / b), 2)} 档</span>` : '<span class="tiny">EV 差 = log2(亮 / 暗)</span>'; }
});
function setField(el){
  const p = getPoint(editing); if(!p) return;
  const path = el.dataset.f.split('.'); let o = p;
  for(let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length - 1]] = el.value;
  save(); updateComputed();
}
function reCode(p){
  const seq = S.points.filter(x => x.area === p.area && x.id !== p.id).reduce((m, x) => Math.max(m, x.seqNo || 0), 0) + 1;
  p.seqNo = seq; p.code = p.area + '-' + pad(seq); save();
}
function updateNames(){
  const p = getPoint(editing);
  document.querySelectorAll('[data-act=name]').forEach(b => { b.firstElementChild.textContent = nextName(p, b.dataset.k); });
}
function calcExp(){
  const t = parseShutter($('#cT').value), iso = num($('#cI').value), N = num($('#cN').value), ev = ev100FromExposure(t, iso, N);
  $('#cOut').innerHTML = ev == null ? '<span class="tiny">EV100 = log2(N² / t) − log2(ISO / 100)</span>' : `EV100 <span class="v">${fmt(ev, 2)}</span> · 估算照度约 <span class="v">${fmt(evToLux(ev), 0)}</span> lux`;
}

$('#photoInput').addEventListener('change', async e => {
  const files = [...e.target.files]; if(!files.length || !photoTarget) return;
  const p = getPoint(photoTarget); if(!p) return;
  toast('正在保存照片…');
  for(const f of files){
    try{ const blob = await compress(f); const id = uid(); await DB.put({id, pointId: p.id, t: Date.now(), blob}); p.photos.push(id); }
    catch(err){ toast('照片保存失败：' + err.message); }
  }
  save(); if(editing === p.id) rerenderKeep(); toast('已保存 ' + files.length + ' 张');
});
$('#gcInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{ const {img} = await loadImage(f); gcImg = img; gcRes = null; gcPt = null; render(); toast('点击灰卡中间取样'); }
  catch(err){ toast(err.message); }
});
$('#importInput').addEventListener('change', e => { const f = e.target.files[0]; if(f) importJson(f); });
document.addEventListener('click', e => {
  if(e.target.id !== 'gcCanvas') return;
  const c = e.target, r = c.getBoundingClientRect();
  sampleGc((e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height);
});

/* ========== 顶部时钟 ========== */
function tick(){
  const o = hk(Date.now());
  $('#hClock').innerHTML = `香港 ${o.hour}:${o.minute}<br>${o.month}/${o.day} ${({Mon:'周一',Tue:'周二',Wed:'周三',Thu:'周四',Fri:'周五',Sat:'周六',Sun:'周日'})[o.weekday] || ''}`;
}
setInterval(() => { tick(); if(tab === 'today') { const y = window.scrollY; const a = document.activeElement; if(!a || a === document.body) { render(); window.scrollTo(0, y); } } }, 60000);

/* ========== 启动 ========== */
if(S.settings.tripStart) dayIdx = null;
tick(); render();
if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
